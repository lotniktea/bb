<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WYROCZNIA DELFICKA</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      gap: 15px;

      /* Pudrowy róż */
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.65) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.45) 0 1.5px, transparent 3px),
        radial-gradient(circle at 40% 75%, rgba(255,255,255,0.5) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 85%, rgba(255,255,255,0.4) 0 1.5px, transparent 3px),
        linear-gradient(
          135deg,
          #f7c6d9 0%,
          #f3b6cf 35%,
          #f8cfe0 65%,
          #efb0cb 100%
        );

      background-size:
        180px 180px,
        240px 240px,
        210px 210px,
        260px 260px,
        100% 100%;

      position: relative;
      overflow-x: hidden;
    }

    /* Delikatna brokatowa poświata */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(255,255,255,0.35),
          transparent 25%
        ),
        radial-gradient(
          circle at 75% 70%,
          rgba(255,255,255,0.25),
          transparent 30%
        );

      animation: shimmer 5s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      from {
        opacity: 0.45;
      }
      to {
        opacity: 0.9;
      }
    }

    h1 {
      font-size: 48px;
      color: white;
      margin: 0;
      text-align: center;
      text-shadow:
        2px 2px 5px rgba(150, 60, 100, 0.25),
        0 0 15px rgba(255,255,255,0.4);
      position: relative;
      z-index: 1;
    }

    h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 28px;
      color: white;
      margin: 0 0 30px 0;
      font-style: italic;
      text-shadow: 1px 1px 4px rgba(150, 60, 100, 0.25);
      position: relative;
      z-index: 1;
    }

    button {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;

      background: black;
      color: white;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.2),
        0 0 15px rgba(255,255,255,0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
      
      position: relative;
      z-index: 1;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 20px rgba(0,0,0,0.25),
        0 0 20px rgba(255,255,255,0.35);
    }

    button:active {
      transform: translateY(1px);
    }

    .card {
      display: none;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      margin-top: 10px;
    }

    .card-inner {
      width: 260px;
      height: 340px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;

      backface-visibility: hidden;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 15px;

      box-sizing: border-box;

      box-shadow:
        0 10px 30px rgba(100, 30, 70, 0.2);
    }

    .card-front {
      background: rgba(255, 255, 255, 0.95);
    }

    .card-front img {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 15px;
    }

    .name {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
      color: black;
      text-align: center;
    }

    .card-back {
      background: black;
      color: white;

      transform: rotateY(180deg);

      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      text-align: center;

      padding: 30px;
    }

    /* Na telefon */
    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 25px;
      }

      .card-inner {
        width: 250px;
        height: 325px;
      }

      .card-front img {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
